[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-frame"
version = "0.1.0"
description = "Transparent Python device RPC and native MQTT publish/subscribe transport"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ohara Lab"}]
dependencies = ["paho-mqtt>=2.0,<3"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.urls]
Homepage = "https://github.com/ohara-lab-su/mqtt_frame"
Documentation = "https://ohara-lab-su.github.io/mqtt_frame/en/"
Repository = "https://github.com/ohara-lab-su/mqtt_frame"

[tool.setuptools.packages.find]
where = ["src"]
