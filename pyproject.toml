[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mqtt-frame"
version = "0.1.0"
description = "MQTT unicast/multicast device RPC and event transport"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Ohara Lab"}]
dependencies = ["paho-mqtt>=2.1,<3"]
[project.urls]
Homepage = "https://github.com/ohara-lab-su/mqtt_frame"
Documentation = "https://ohara-lab-su.github.io/mqtt_frame/"
Repository = "https://github.com/ohara-lab-su/mqtt_frame"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
